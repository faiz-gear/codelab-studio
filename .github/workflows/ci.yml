name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]

    steps:
      - name: Preserve LF line endings on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: git config --global core.autocrlf false

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Tauri Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Go for verification tests
        uses: actions/setup-go@v7
        with:
          go-version: '1.27.4'
          cache: false

      - name: Resolve Go build cache
        id: go-cache
        shell: bash
        run: |
          printf 'dir=%s\n' "$(go env GOCACHE | tr -d '\r')" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$(go env GOVERSION | tr -d '\r')" >> "$GITHUB_OUTPUT"
          printf 'image=%s\n' "${ImageVersion:-default}" >> "$GITHUB_OUTPUT"

      - name: Cache Go build artifacts
        uses: actions/cache@v6
        with:
          path: ${{ steps.go-cache.outputs.dir }}
          key: go-race-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.version }}-${{ steps.go-cache.outputs.image }}
          restore-keys: |
            go-race-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.go-cache.outputs.version }}-

      - name: Warm Go race build cache
        shell: bash
        run: go build -race encoding/json net/http net/http/httptest testing

      - name: Setup Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run full verification suite
        run: pnpm run check:all

      - name: Build Tauri desktop shell binary
        run: cargo build -p codelab-studio
