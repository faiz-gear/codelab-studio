  <rect class="elev" x="688" y="568" width="124" height="26" rx="6"/><text class="t" x="698" y="585">✓ 测试判题 3/4</text>
  <text class="ts" x="824" y="585">+</text>
  <rect class="ai" x="954" y="569" width="112" height="24" rx="12"/><text x="964" y="585" font-size="11" fill="#6D28D9" font-weight="600">🩺 诊断最后报错</text>
  <g class="mono">
