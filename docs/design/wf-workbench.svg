<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="Geist, 'PingFang SC', sans-serif">
  <style>
    .bg{fill:#F6F8FA;stroke:#94A3B8;stroke-width:1.2}
