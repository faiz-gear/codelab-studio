  <text class="note" x="30" y="696">① 顶部 44px 桌面栏：四语言课程切换、进度条、环境体检、布局预设</text>
  <text class="note" x="30" y="718">② 交互手册左栏：大纲抽屉、cwd 命令块、自动验收卡、思考题</text>
  <text class="note" x="30" y="740">③ 实时产物文件树（196px）：多文件/双项目树、新建、Diff、外部 IDE</text>
  <text class="note" x="30" y="762">④ Monaco 编辑器 + LSP 状态栏：多标签、语法高亮、gopls/pyright 降级</text>
  <text class="note" x="30" y="784">⑤ 跨区域划词浮层：手册/编辑器/终端三区拖选 120ms 浮现，不遮挡选区</text>
  <text class="note" x="30" y="806">⑥ 双模底栏：常驻服务(⚡)与普通终端(⌘)隔离 + 函数判题(✓) Tab</text>
  <text class="note" x="30" y="828">⑦ AI 助教抽屉（372px）：支持 BYOK / ACP 双协议 + 引导/直接切换</text>
  <text class="note" x="30" y="850">⑧ 上下文 Chip + ACP 工具权限审批卡（引导只读，写操作需确认）</text>

  <!-- Center Pane: File Tree (196) + Editor (464) -->
