  <rect class="blue" x="276" y="369" width="112" height="26" rx="6"/><text x="288" y="386" font-size="11.5" fill="#fff" font-weight="600">▶ 运行本节验收</text>
  <text class="t" x="34" y="420" fill="#15803D">✓ GET /healthz 返回 200  (🤖 自动)</text>
  <text class="t" x="34" y="446" fill="#15803D">✓ POST /healthz 返回 405  (🤖 自动)</text>
  <text class="t" x="34" y="472" fill="#DC2626">✕ /missing 返回 404  · 实际 200</text>
  <rect class="ai" x="292" y="456" width="94" height="22" rx="11"/><text x="303" y="471" font-size="11" fill="#6D28D9">🩺 问 AI 诊断</text>
