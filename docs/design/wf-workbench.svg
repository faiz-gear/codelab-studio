  <rect class="elev" x="0" y="44" width="420" height="36"/>
  <text class="tb" x="16" y="67">☰  练习 1：让一个请求完成往返</text>
  <text class="ts" x="358" y="66">章节大纲</text>

  <g class="ph">
    <rect x="20" y="98" width="340" height="10" rx="3"/>
    <rect x="20" y="116" width="370" height="10" rx="3"/>
    <rect x="20" y="134" width="280" height="10" rx="3"/>
  </g>

  <!-- Command Block 1 (Daemon) -->
