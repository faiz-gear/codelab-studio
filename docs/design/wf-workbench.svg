  <circle cx="20" cy="22" r="5" fill="#EF4444"/><circle cx="36" cy="22" r="5" fill="#F59E0B"/><circle cx="52" cy="22" r="5" fill="#22C55E"/>
  <text class="tb" x="76" y="27">←  Go 与 GoFrame 开发实践 ▾</text>
  <rect x="330" y="17" width="140" height="10" rx="5" fill="#CBD5E1"/><rect x="330" y="17" width="60" height="10" rx="5" fill="#2563EB"/>
  <text class="ts" x="480" y="26">4/10 练习</text>
  <rect class="ok" x="560" y="10" width="128" height="24" rx="12"/><text x="574" y="26" font-size="11.5" fill="#15803D" font-weight="600">● 四语言环境就绪</text>
  <rect class="elev" x="980" y="9" width="170" height="26" rx="6"/><text class="ts" x="994" y="26">标准 | 辅导 | 专注 ⌘B</text>
  <rect class="ai" x="1162" y="9" width="120" height="26" rx="6"/><text x="1174" y="26" font-size="12" fill="#6D28D9" font-weight="600">✦ AI 助教 · ACP</text>
  <rect class="elev" x="1292" y="9" width="64" height="26" rx="6"/><text class="t" x="1308" y="26">◐ 主题</text>
  <rect class="elev" x="1364" y="9" width="64" height="26" rx="6"/><text class="t" x="1380" y="26">⚙ 设置</text>

  <!-- Left Pane: Manual 420px -->
