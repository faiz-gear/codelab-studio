  <rect class="elev" x="20" y="160" width="380" height="30" rx="8"/>
  <rect x="20" y="160" width="3" height="82" fill="#2563EB"/>
  <text class="mono" x="32" y="179">cwd: task-api · ⚡常驻服务</text>
  <rect class="blue" x="302" y="164" width="54" height="22" rx="5"/><text x="313" y="179" font-size="11" fill="#fff" font-weight="600">▶ 运行</text>
  <rect class="surf" x="362" y="164" width="30" height="22" rx="5"/><text class="ts" x="372" y="179">+</text>
  <text class="mono" x="34" y="218">$ go run .</text>

  <!-- Command Block 2 (Oneshot) -->
  <rect class="surf" x="20" y="256" width="380" height="82" rx="8"/>
  <rect class="elev" x="20" y="256" width="380" height="30" rx="8"/>
  <text class="mono" x="32" y="275">cwd: task-api</text>
  <rect class="ok" x="210" y="261" width="84" height="20" rx="10"/><text x="220" y="275" font-size="11" fill="#15803D">✓ 0 · 0.2s</text>
  <rect class="blue" x="302" y="260" width="54" height="22" rx="5"/><text x="313" y="275" font-size="11" fill="#fff" font-weight="600">▶ 运行</text>
  <text class="mono" x="34" y="314">$ curl -i http://127.0.0.1:8080/healthz</text>

