[package]
name = "codelab-core"
version.workspace = true
edition.workspace = true
authors.workspace = true

[dependencies]
ammonia.workspace = true
chrono.workspace = true
icu_normalizer.workspace = true
pulldown-cmark.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
thiserror.workspace = true
url = "2"
flate2 = "1"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls", "system-proxy"] }
sha2 = "0.10"
tar = "0.4"
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
cap-std = "4"
cap-fs-ext = "4"
cap-tempfile = "4"
notify = "9"
base64 = "0.22"
strip-ansi-escapes = "0.2"
tree-sitter = "0.25"
tree-sitter-bash = "0.25"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }
