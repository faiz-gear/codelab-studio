[package]
name = "codelab-studio"
version = "0.1.0"
edition = "2021"
description = "CodeLab Studio pure Rust domain contracts"
license = "MIT"

[lib]
name = "codelab_studio_lib"
path = "src/lib.rs"

[dependencies]
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ts-rs = { version = "10", features = ["serde-json-impl"] }
