[workspace]
members = [
    "crates/codelab-core",
    "src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["CodeLab Studio Contributors"]

[workspace.dependencies]
ammonia = "4"
chrono = { version = "0.4", features = ["serde"] }
icu_normalizer = "2"
pulldown-cmark = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
